<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кадр">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Кадр: ИИ-камера</title>
<style>
:root{--y:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#f2efe6;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b0b0e;border-radius:22px;overflow:hidden}
#view{max-width:100%;max-height:100%;touch-action:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;pointer-events:none}
#hud span{background:rgba(0,0,0,.55);padding:4px 10px;border-radius:14px}
#score{color:var(--y)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{from{opacity:.9}to{opacity:0}}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#0b0b0e;padding:24px;text-align:center}
#intro h1{margin:0;font-size:26px}
#intro p{margin:0;color:#9a9ca4;font-size:14px;max-width:320px}
button,.btn{font:600 15px inherit;font-family:inherit;border:0;border-radius:24px;padding:12px 20px;background:#23252d;color:#f2efe6;cursor:pointer}
.main{background:var(--y);color:#15161a}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--y);outline-offset:2px}
#msg{text-align:center;font-weight:600;font-size:15px;padding:10px 6px 4px;min-height:36px}
#msg.ok{color:var(--y)}
#strip{display:flex;gap:8px;overflow-x:auto;min-height:0;padding:4px 2px}
#strip img{height:56px;border-radius:6px;cursor:pointer;border:2px solid #333}
#bar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 14px}
#sh{width:68px;height:68px;border-radius:50%;border:4px solid #f2efe6;background:transparent;padding:0;position:relative}
#sh i{position:absolute;inset:5px;border-radius:50%;background:#f2efe6}
#sh.on i{background:var(--y)}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view" width="720" height="960"></canvas>
    <div id="hud"><span id="score">Композиция 0%</span><span id="net">Нейросеть: не загружена</span></div>
    <div id="flash"></div>
    <div id="intro">
      <h1>Кадр</h1>
      <p>Камера сама ищет красивую композицию, показывает рамку и стрелку, подбирает зум и снимает.</p>
      <button class="main" id="go">Включить камеру</button>
      <label class="btn" for="file">Проверить на готовом фото</label>
    </div>
  </div>
  <div id="msg">Нажми «Включить камеру»</div>
  <div id="strip" aria-label="Снятые кадры. Нажми, чтобы сохранить"></div>
  <div id="bar">
    <button id="auto" aria-pressed="true">Авто: вкл</button>
    <button id="sh" aria-label="Снять"><i></i></button>
    <label class="btn" for="file">Фото</label>
  </div>
  <input type="file" id="file" accept="image/*">
</div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var view=$('view'),ctx=view.getContext('2d');
var gc=document.createElement('canvas'),gx=gc.getContext('2d',{willReadFrequently:true});
var dc=document.createElement('canvas'),dx=dc.getContext('2d');
var src=null,SW=0,SH=0,mode='',stream=null;
var z=1,zT=1,cx=.5,cy=.5,cxT=.5,cyT=.5,ZMAX=4;
var auto=true,busy=false,readyN=0,cool=0,best=null,off={x:0,y:0},ready=false,curS=0,det=null,netLoading=false,lastShot=0;

function say(t,ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':''}

function setSource(el,w,h,m){
  src=el;SW=w;SH=h;mode=m;z=zT=1;cx=cxT=cy=cyT=.5;readyN=0;best=null;
  var k=720/Math.max(w,h);view.width=Math.round(w*k);view.height=Math.round(h*k);
  gc.width=64;gc.height=Math.max(8,Math.round(64*h/w));
  dc.width=320;dc.height=Math.max(32,Math.round(320*h/w));
  $('intro').style.display='none';loadNet();
}

/* ---------- Источники ---------- */
$('go').onclick=async function(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    var v=document.createElement('video');v.muted=true;v.setAttribute('playsinline','');v.autoplay=true;
    v.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(v);v.srcObject=stream;await v.play();
    if(!v.videoWidth)await new Promise(function(r){v.onloadedmetadata=r});
    setSource(v,v.videoWidth,v.videoHeight,'cam');say('Веди камеру по сцене');
  }catch(e){say('Нет доступа к камере. Разреши её в браузере или проверь на готовом фото.')}
};
$('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var img=new Image();img.onload=function(){
    setSource(img,img.naturalWidth,img.naturalHeight,'img');auto=true;syncAuto();say('Анализирую фото…');
  };img.src=URL.createObjectURL(f);e.target.value='';
};

/* ---------- Нейросеть (детектор объектов) ---------- */
function addScript(u){return new Promise(function(res,rej){var s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadNet(){
  if(netLoading)return;netLoading=true;$('net').textContent='Нейросеть: загрузка…';
  addScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js')
   .then(function(){return addScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js')})
   .then(function(){return cocoSsd.load({base:'lite_mobilenet_v2'})})
   .then(function(m){det=m;$('net').textContent='Нейросеть: объекты + композиция'})
   .catch(function(){$('net').textContent='Базовый режим (без детектора)'});
}

/* ---------- Анализ композиции ---------- */
function sat(w,h,fn){var s=new Float64Array((w+1)*(h+1));
  for(var y=0;y<h;y++){var row=0;for(var x=0;x<w;x++){row+=fn(x,y);s[(y+1)*(w+1)+x+1]=s[y*(w+1)+x+1]+row}}return s}
function rs(s,w,x0,y0,x1,y1){return s[y1*(w+1)+x1]-s[y0*(w+1)+x1]-s[y1*(w+1)+x0]+s[y0*(w+1)+x0]}

async function analyze(){
  if(!src||busy||Date.now()<lastShot+900)return;
  if(Math.abs(zT-z)>.03||Math.abs(cxT-cx)>.01||Math.abs(cyT-cy)>.01)return;
  busy=true;
  try{
    var sw=SW/z,sh=SH/z,sx=Math.min(Math.max(cx*SW-sw/2,0),SW-sw),sy=Math.min(Math.max(cy*SH-sh/2,0),SH-sh);
    var w=gc.width,h=gc.height;
    gx.drawImage(src,sx,sy,sw,sh,0,0,w,h);
    var d=gx.getImageData(0,0,w,h).data,L=new Float32Array(w*h);
    for(var i=0;i<w*h;i++)L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
    var E=new Float32Array(w*h);
    for(var y=0;y<h-1;y++)for(var x=0;x<w-1;x++){var a=L[y*w+x];E[y*w+x]=Math.abs(L[y*w+x+1]-a)+Math.abs(L[(y+1)*w+x]-a)}
    var SE=sat(w,h,function(x,y){return E[y*w+x]}),SL=sat(w,h,function(x,y){return L[y*w+x]}),
        SL2=sat(w,h,function(x,y){var v=L[y*w+x];return v*v}),SD=sat(w,h,function(x,y){return L[y*w+x]<25?1:0}),
        SX=sat(w,h,function(x,y){return E[y*w+x]*x}),SY=sat(w,h,function(x,y){return E[y*w+x]*y});
    var boxes=[];
    if(det){
      dx.drawImage(src,sx,sy,sw,sh,0,0,dc.width,dc.height);
      var p=await det.detect(dc);
      p.forEach(function(o){if(o.score>.5)boxes.push({x:o.bbox[0]/dc.width,y:o.bbox[1]/dc.height,w:o.bbox[2]/dc.width,h:o.bbox[3]/dc.height})});
    }
    function ev(r){
      var x0=Math.round(r.x*w),y0=Math.round(r.y*h),x1=Math.min(w,Math.round((r.x+r.w)*w)),y1=Math.min(h,Math.round((r.y+r.h)*h));
      if(x1-x0<4||y1-y0<4)return -9;
      var n=(x1-x0)*(y1-y0),sE=rs(SE,w,x0,y0,x1,y1),mE=sE/n,mL=rs(SL,w,x0,y0,x1,y1)/n;
      var sd=Math.sqrt(Math.max(rs(SL2,w,x0,y0,x1,y1)/n-mL*mL,0)),dark=rs(SD,w,x0,y0,x1,y1)/n;
      var close=.5;
      if(sE>1){var ccx=(rs(SX,w,x0,y0,x1,y1)/sE-x0)/(x1-x0),ccy=(rs(SY,w,x0,y0,x1,y1)/sE-y0)/(y1-y0);
        var dd=function(c){return 1-Math.min(Math.min(Math.abs(c-1/3),Math.abs(c-.5),Math.abs(c-2/3))/.17,1)};close=(dd(ccx)+dd(ccy))/2}
      var s=.5*Math.min(mE/20,1)+.25*Math.min(sd/55,1)+.15*close-.6*Math.max(dark-.3,0)-.05*(1-r.w);
      boxes.forEach(function(b){
        var ix=Math.max(0,Math.min(b.x+b.w,r.x+r.w)-Math.max(b.x,r.x)),iy=Math.max(0,Math.min(b.y+b.h,r.y+r.h)-Math.max(b.y,r.y));
        var fr=ix*iy/(b.w*b.h);if(fr>=.97)s+=.25;else if(fr>.2)s-=.15;
      });
      return s;
    }
    var cands=[{x:0,y:0,w:1,h:1}];
    [.8,.65,.5].forEach(function(f){[f/2,.5,1-f/2].forEach(function(px){[f/2,.5,1-f/2].forEach(function(py){cands.push({x:px-f/2,y:py-f/2,w:f,h:f})})})});
    boxes.forEach(function(b){var f=Math.min(Math.max(Math.max(b.w,b.h)/.65,.4),1),ccx=b.x+b.w/2,ccy=b.y+b.h/2;
      cands.push({x:Math.min(Math.max(ccx-f/2,0),1-f),y:Math.min(Math.max(ccy-f/2,0),1-f),w:f,h:f})});
    var cur=ev(cands[0]),b0=cands[0],bs=cur;
    cands.forEach(function(c){var s=ev(c);if(s>bs){bs=s;b0=c}});
    if(bs<cur+.06){b0=cands[0];bs=cur}
    best=b0;curS=cur;off={x:b0.x+b0.w/2-.5,y:b0.y+b0.h/2-.5};ready=b0.w>.98;
    var dist=Math.hypot(off.x,off.y);
    if(ready){readyN++;say('Отличный кадр',true)}
    else{
      readyN=0;
      if(mode==='img'||dist<.07){
        // зум и (для фото) смещение к лучшему кадру
        var fAbs=b0.w/z;zT=Math.min(ZMAX,Math.max(1,1/fAbs));
        if(mode==='img'){var ac=cx+off.x/z,ad=cy+off.y/z;cxT=Math.min(Math.max(ac,.5/zT),1-.5/zT);cyT=Math.min(Math.max(ad,.5/zT),1-.5/zT)}
        say('Подбираю зум до '+zT.toFixed(1)+'×');
      }else{
        say('Лучший кадр рядом: поверни камеру '+(Math.abs(off.x)>Math.abs(off.y)?(off.x>0?'вправо':'влево'):(off.y>0?'вниз':'вверх')));
      }
    }
    $('score').textContent='Композиция '+Math.max(0,Math.min(100,Math.round(cur*100/.9)))+'%';
    $('sh').classList.toggle('on',ready);
    if(auto&&ready&&readyN>=3&&Date.now()>cool&&cur>=.3)shoot();
  }catch(e){}
  busy=false;
}
setInterval(analyze,350);

/* ---------- Съёмка и сохранение ---------- */
function shoot(){
  if(!src)return;
  var sw=SW/z,sh=SH/z,sx=Math.min(Math.max(cx*SW-sw/2,0),SW-sw),sy=Math.min(Math.max(cy*SH-sh/2,0),SH-sh);
  var k=Math.min(1,2400/Math.max(sw,sh)),o=document.createElement('canvas');
  o.width=Math.round(sw*k);o.height=Math.round(sh*k);o.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,o.width,o.height);
  var f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  o.toBlob(function(b){
    var u=URL.createObjectURL(b),im=new Image();im.src=u;im.alt='Снятый кадр';
    im.onclick=function(){saveBlob(b)};$('strip').prepend(im);
    say('Кадр снят. Нажми на него внизу, чтобы сохранить',true);
  },'image/jpeg',.92);
  lastShot=Date.now();cool=Date.now()+3000;readyN=0;
  if(mode==='img'){auto=false;syncAuto()}
  setTimeout(function(){zT=1;cxT=cyT=.5},700);
}
function saveBlob(b){
  var name='kadr-'+Date.now()+'.jpg',file=new File([b],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){})}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
}
$('sh').onclick=shoot;
function syncAuto(){$('auto').textContent='Авто: '+(auto?'вкл':'выкл');$('auto').setAttribute('aria-pressed',auto)}
$('auto').onclick=function(){auto=!auto;syncAuto()};

/* ---------- Отрисовка ---------- */
function arrow(x,y,ang,s){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle='#ffd23f';ctx.beginPath();
  ctx.moveTo(0,-s);ctx.lineTo(s*.7,s*.6);ctx.lineTo(0,s*.25);ctx.lineTo(-s*.7,s*.6);ctx.closePath();ctx.fill();ctx.restore();
}
function draw(){
  requestAnimationFrame(draw);
  if(!src)return;
  z+=(zT-z)*.08;cx+=(cxT-cx)*.08;cy+=(cyT-cy)*.08;
  if(Math.abs(zT-z)<.002)z=zT;
  var sw=SW/z,sh=SH/z,sx=Math.min(Math.max(cx*SW-sw/2,0),SW-sw),sy=Math.min(Math.max(cy*SH-sh/2,0),SH-sh);
  ctx.drawImage(src,sx,sy,sw,sh,0,0,view.width,view.height);
  var W=view.width,H=view.height,u=W/720;
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=u;ctx.beginPath();
  for(var i=1;i<3;i++){ctx.moveTo(W*i/3,0);ctx.lineTo(W*i/3,H);ctx.moveTo(0,H*i/3);ctx.lineTo(W,H*i/3)}ctx.stroke();
  if(best&&!ready&&Math.abs(zT-z)<.05){
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=5*u;ctx.beginPath();
    var r=best,rx=r.x*W,ry=r.y*H,rw=r.w*W,rh=r.h*H;
    if(ctx.roundRect)ctx.roundRect(rx,ry,rw,rh,18*u);else ctx.rect(rx,ry,rw,rh);ctx.stroke();
    ctx.fillStyle='#ffd23f';ctx.font='italic 800 '+(30*u)+'px sans-serif';ctx.textAlign='left';
    ctx.fillText('что я снимаю',Math.max(10,Math.min(W-260*u,rx)),Math.max(34*u,ry-12*u));
    if(mode==='cam'&&Math.hypot(off.x,off.y)>.07){
      var ang=Math.atan2(off.x,-off.y);arrow(W/2+Math.sin(ang)*W*.12,H/2-Math.cos(ang)*H*.12,ang,42*u);
    }
  }
  if(readyN>0){ctx.strokeStyle='#ffd23f';ctx.lineWidth=9*u;ctx.beginPath();ctx.arc(W/2,H/2,64*u,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,readyN/3));ctx.stroke()}
}
requestAnimationFrame(draw);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
